label live-forensic-pt-br
        menu label Live System (amd64 ^Modo Forense Portugues-BR)
        menu default		
        linux /live/vmlinuz
        initrd /live/initrd.img
        append boot=live username=kali hostname=kali systemd.swap=no noautomount locales=pt_BR.UTF-8

label live-forensic
        menu label Live system (amd64 ^Forensic Mode English) 
        menu default		
        linux /live/vmlinuz
        initrd /live/initrd.img
        append boot=live username=kali hostname=kali systemd.swap=no noautomount
		
label live-amd64
        menu label ^Live system (amd64)
        linux /live/vmlinuz
        initrd /live/initrd.img
        append boot=live components quiet splash noeject

label live-amd64-failsafe
        menu label Live system (amd64 fail-safe mode)
        linux /live/vmlinuz
        initrd /live/initrd.img
        append boot=live components noeject memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
